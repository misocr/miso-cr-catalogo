<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISO CR | Cuadros personalizados</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f7f5;
      color: #222;
    }

    header {
      background: #ffffff;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .header-content {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .logo span {
      font-weight: 400;
    }

    .cart-button {
      border: none;
      background: #222;
      color: white;
      padding: 12px 17px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
    }

    .hero {
      max-width: 1100px;
      margin: auto;
      padding: 55px 20px 35px;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(32px, 7vw, 58px);
      line-height: 1.05;
      margin-bottom: 18px;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      color: #666;
      font-size: 17px;
      line-height: 1.6;
    }

    .search {
      max-width: 600px;
      margin: 30px auto 0;
    }

    .search input {
      width: 100%;
      padding: 15px 20px;
      border: 1px solid #ddd;
      border-radius: 30px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    .categories {
      max-width: 1100px;
      margin: 10px auto 35px;
      padding: 0 20px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      white-space: nowrap;
      border: 1px solid #ddd;
      background: white;
      padding: 11px 16px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
    }

    .category.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .products {
      max-width: 1100px;
      margin: auto;
      padding: 0 20px 60px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 3px 15px rgba(0,0,0,0.07);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 14px;
      text-align: center;
      padding: 20px;
    }

    .product-info {
      padding: 16px;
    }

    .product-category {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    .product h3 {
      font-size: 17px;
      margin-bottom: 10px;
    }

    .price {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 13px;
    }

    .add-button {
      width: 100%;
      border: none;
      background: #222;
      color: white;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .cart-panel {
      position: fixed;
      right: -100%;
      top: 0;
      width: min(400px, 100%);
      height: 100vh;
      background: white;
      z-index: 300;
      box-shadow: -5px 0 25px rgba(0,0,0,0.15);
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .cart-panel.open {
      right: 0;
    }

    .cart-header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
    }

    .close-cart {
      border: none;
      background: none;
      font-size: 25px;
      cursor: pointer;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .cart-item {
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item strong {
      display: block;
      margin-bottom: 5px;
    }

    .cart-footer {
      padding: 20px;
      border-top: 1px solid #eee;
    }

    .total {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .whatsapp {
      width: 100%;
      border: none;
      background: #25D366;
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 40px 10px;
    }

    footer {
      text-align: center;
      padding: 35px 20px;
      background: #222;
      color: white;
    }

    footer p {
      color: #bbb;
      margin-top: 8px;
      font-size: 14px;
    }

    @media (min-width: 700px) {
      .products {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">MISO<span>CR</span></div>

    <button class="cart-button" onclick="openCart()">
      🛒 Carrito <span id="cart-count">0</span>
    </button>
  </div>
</header>

<section class="hero">
  <h1>Recuerdos que<br>se convierten en luz ✨</h1>

  <p>
    Cuadros personalizados con luz LED para convertir
    tus momentos, personas y logros favoritos en algo
    que puedas conservar para siempre.
  </p>

  <div class="search">
    <input
      type="text"
      id="search"
      placeholder="🔎 Buscar un cuadro..."
      oninput="filterProducts()"
    >
  </div>
</section>

<div class="categories">

  <button class="category active" onclick="filterCategory('Todos', this)">
    Todos
  </button>

  <button class="category" onclick="filterCategory('Parejas', this)">
    ❤️ Parejas
  </button>

  <button class="category" onclick="filterCategory('Familia', this)">
    👨‍👩‍👧 Familia
  </button>

  <button class="category" onclick="filterCategory('Mascotas', this)">
    🐶 Mascotas
  </button>

  <button class="category" onclick="filterCategory('Cumpleaños', this)">
    🎂 Cumpleaños
  </button>

  <button class="category" onclick="filterCategory('Aniversarios', this)">
    💍 Aniversarios
  </button>

  <button class="category" onclick="filterCategory('Graduación', this)">
    🎓 Graduación & Escolar
  </button>

  <button class="category" onclick="filterCategory('Anime', this)">
    🎌 Anime
  </button>

  <button class="category" onclick="filterCategory('Reconocimientos', this)">
    🏆 Reconocimientos & Homenajes
  </button>

  <button class="category" onclick="filterCategory('Otros', this)">
    ✨ Otros
  </button>

</div>

<section class="products" id="products"></section>

<div class="cart-panel" id="cart-panel">

  <div class="cart-header">
    <h2>🛒 Tu carrito</h2>

    <button class="close-cart" onclick="closeCart()">
      ×
    </button>
  </div>

  <div class="cart-items" id="cart-items">
  </div>

  <div class="cart-footer">

    <div class="total">
      Total: ₡<span id="cart-total">0</span>
    </div>

    <button class="whatsapp" onclick="sendWhatsApp()">
      📲 Pedir por WhatsApp
    </button>

  </div>

</div>

<footer>
  <strong>MISO CR</strong>
  <p>Cuadros personalizados con luz LED ✨</p>
</footer>

<script>

const products = [

  {
    name: "Cuadro LED personalizado",
    category: "Parejas",
    price: 15000,
    image: "https://placehold.co/600x600?text=Cuadro+Parejas"
  },

  {
    name: "Cuadro LED familiar",
    category: "Familia",
    price: 15000,
    image: "https://placehold.co/600x600?text=Cuadro+Familia"
  },

  {
    name: "Cuadro LED para mascotas",
    category: "Mascotas",
    price: 15000,
    image: "https://placehold.co/600x600?text=Cuadro+Mascotas"
  },

  {
    name: "Cuadro LED de cumpleaños",
    category: "Cumpleaños",
    price: 15000,
    image: "https://placehold.co/600x600?text=Cumpleaños"
  },

  {
    name: "Cuadro LED de aniversario",
    category: "Aniversarios",
    price: 15000,
    image: "https://placehold.co/600x600?text=Aniversario"
  },

  {
    name: "Cuadro LED de graduación",
    category: "Graduación",
    price: 15000,
    image: "https://placehold.co/600x600?text=Graduación"
  },

  {
    name: "Cuadro LED Anime",
    category: "Anime",
    price: 15000,
    image: "https://placehold.co/600x600?text=Anime"
  },

  {
    name: "Cuadro LED de reconocimiento",
    category: "Reconocimientos",
    price: 18000,
    image: "https://placehold.co/600x600?text=Reconocimiento"
  }

];

let cart = [];
let currentCategory = "Todos";

function renderProducts() {

  const container = document.getElementById("products");

  const searchText =
    document.getElementById("search").value.toLowerCase();

  const filtered = products.filter(product => {

    const matchesCategory =
      currentCategory === "Todos" ||
      product.category === currentCategory;

    const matchesSearch =
      product.name.toLowerCase().includes(searchText);

    return matchesCategory && matchesSearch;

  });

  container.innerHTML = "";

  filtered.forEach((product, index) => {

    container.innerHTML += `

      <article class="product">

        <div class="product-image">

          <img
            src="${product.image}"
            alt="${product.name}"
            style="width:100%;height:100%;object-fit:cover;"
          >

        </div>

        <div class="product-info">

          <div class="product-category">
            ${product.category}
          </div>

          <h3>${product.name}</h3>

          <div class="price">
            ₡${product.price.toLocaleString("es-CR")}
          </div>

          <button
            class="add-button"
            onclick="addToCart(${products.indexOf(product)})"
          >
            ＋ Agregar al carrito
          </button>

        </div>

      </article>

    `;

  });

}

function filterCategory(category, button) {

  currentCategory = category;

  document
    .querySelectorAll(".category")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  renderProducts();

}

function filterProducts() {
  renderProducts();
}

function addToCart(index) {

  cart.push(products[index]);

  updateCart();

  openCart();

}

function updateCart() {

  document.getElementById("cart-count").textContent = cart.length;

  const container = document.getElementById("cart-items");

  if (cart.length === 0) {

    container.innerHTML =
      '<div class="empty">Tu carrito está vacío ✨</div>';

    document.getElementById("cart-total").textContent = "0";

    return;
  }

  container.innerHTML = "";

  let total = 0;

  cart.forEach(product => {

    total += product.price;

    container.innerHTML += `

      <div class="cart-item">

        <strong>${product.name}</strong>

        <span>
          ₡${product.price.toLocaleString("es-CR")}
        </span>

      </div>

    `;

  });

  document.getElementById("cart-total").textContent =
    total.toLocaleString("es-CR");

}

function openCart() {

  document
    .getElementById("cart-panel")
    .classList.add("open");

}

function closeCart() {

  document
    .getElementById("cart-panel")
    .classList.remove("open");

}

function sendWhatsApp() {

  if (cart.length === 0) {

    alert("Tu carrito está vacío.");

    return;

  }

  let message =
    "Hola MISO CR 🧡✨ Quiero hacer este pedido:%0A%0A";

  cart.forEach(product => {

    message +=
      "• " +
      product.name +
      " — ₡" +
      product.price.toLocaleString("es-CR") +
      "%0A";

  });

  const total =
    cart.reduce((sum, product) => sum + product.price, 0);

  message +=
    "%0A💰 Total: ₡" +
    total.toLocaleString("es-CR");

  /*
    IMPORTANTE:
    Aquí colocaremos el número real de WhatsApp de MISO CR.
  */

  const phone = "50600000000";

  window.open(
    "https://wa.me/" + phone + "?text=" + message,
    "_blank"
  );

}

renderProducts();
updateCart();

</script>

</body>
</html>
